<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Cell Vision</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="mark">CV</div>
        <div>
          <p class="eyebrow">CELL VISION</p>
          <h1>正在启动生产平台</h1>
          <p id="status" class="status">正在初始化客户端……</p>
          <div class="progress"><span></span></div>
          <div id="actions" class="actions" hidden>
            <button id="retry" type="button">重新检查</button>
            <button id="logs" class="secondary" type="button">打开日志</button>
          </div>
        </div>
      </section>
      <p class="hint">项目数据保存在独立 Workspace 中，客户端更新不会覆盖历史项目。</p>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
