<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>细胞筛选项目</title>
  <link rel="stylesheet" href="/project-assets/project-list.css?v=20260811-project-list-v4">
</head>
<body>
  <header class="hub-header">
    <div>
      <p class="eyebrow">CELL VISION · PROJECT HUB</p>
      <h1>项目列表</h1>
      <p class="subtitle">选择项目进入板子汇总，或创建一个新的数据计算任务。</p>
    </div>
    <div class="hub-actions">
      <button id="refreshButton" class="secondary" type="button">刷新</button>
      <button id="newTaskButton" class="primary" type="button">新建任务</button>
    </div>
  </header>

  <main class="hub-main">
    <section class="hub-summary" id="summaryCards"></section>
    <section class="panel">
      <div class="section-heading">
      <div><h2>项目</h2><p class="muted">项目之间相互独立；点击项目行进入对应板子审核。</p></div>
        <span id="projectCount" class="badge"></span>
      </div>
      <div class="project-table-wrap">
        <table class="project-table">
          <thead>
            <tr>
              <th>项目</th>
              <th>检测时间</th>
              <th>创建人</th>
              <th>状态</th>
              <th>结果汇总</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="projectRows"><tr><td colspan="6" class="empty">正在加载项目…</td></tr></tbody>
        </table>
      </div>
    </section>
    <section class="panel">
      <div class="section-heading"><div><h2>任务队列</h2><p class="muted">新任务先解析文件夹并确认时间点，随后按末点数据快速排除无明显生长的孔。</p><p class="task-queue-note">queued 表示排队中、尚未开始；执行后会显示阶段和进度。</p></div></div>
      <div id="taskRows" class="task-list"><div class="empty">暂无任务</div></div>
    </section>
  </main>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <div class="dialog-heading"><div><h2>新建计算任务</h2><p class="muted">选择包含 sessions.idx 的数据文件夹，解析后勾选用于本轮计算的实际日龄。</p></div><button id="closeTaskButton" class="icon-button" type="button" aria-label="关闭">×</button></div>
      <label>任务名称<input id="taskName" required placeholder="默认使用所选文件夹名称"></label>
      <label>创建人<input id="createdBy" required placeholder="请输入创建人姓名"></label>
      <label>数据文件夹<div class="folder-row"><input id="folderPath" required placeholder="例如 E:\\CM\\20260623 QL2603"><button id="browseButton" class="secondary" type="button">选择文件夹</button></div></label>
      <div id="analysisResult" class="analysis-result muted">选择文件夹后点击解析。</div>
      <div id="timepointPicker" class="timepoint-picker" hidden></div>
      <div class="endpoint-note" id="endpointNote" hidden></div>
      <div class="dialog-actions"><button id="cancelTaskButton" class="secondary" type="button">取消</button><button id="analyzeButton" class="secondary" type="button">解析数据</button><button id="queueButton" class="primary" type="button" disabled>加入队列</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/project-assets/project-list.js?v=20260811-project-list-v4"></script>
  <script>if(new URLSearchParams(location.search).get("new-task")==="1")document.getElementById("taskDialog").showModal();</script>
</body>
</html>
