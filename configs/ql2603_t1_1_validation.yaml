experiment:
  experiment_id: "QL2603-T1-1-validation"
  plate_id: "QL2603_T1-1"
  # The explicit session folders make the validation scope auditable and
  # prevent later sessions from being imported as T3/T4.
  timepoint_directories:
    T0: "E:/CM/20260623 QL2603/2026/06/23/2026-06-23 11-41-17"
    T1: "E:/CM/20260623 QL2603/2026/06/24/2026-06-24 08-51-44"
    T2: "E:/CM/20260623 QL2603/2026/06/25/2026-06-25 08-39-41"

morphology_classifier:
  excluded_wells: ["A1"]
  reuse_candidate_manifest: false

dense_detection:
  include_manual_anchors: false
  reuse_unchanged_stage: false

v2_inference:
  reuse_unchanged_stage: false

review_queue:
  excluded_wells: ["A1"]
  apply_manual_point_overrides: false

joint_training:
  sources: []

review:
  late_timepoint_directories:
    T3: "E:/CM/20260623 QL2603/2026/06/30/2026-06-30 12-38-22"
    T4: "E:/CM/20260623 QL2603/2026/07/07/2026-07-07 10-15-11"
  timepoint_display_names:
    T0: "T0"
    T1: "T1"
    T2: "T2"
    T3: "Day7"
    T4: "Day14"
  day14_overlay:
    downsample: 4
    minimum_component_coverage_pct: 1.0
    minimum_radius_px: 40.0
    minimum_mean_distance_px: 10.0

gated_report:
  group_id: "QL2603 T1-1"
